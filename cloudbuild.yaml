# Google Cloud Build - Deploy to Cloud Run
# Run: gcloud builds submit --config=cloudbuild.yaml

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/stock-dashboard', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stock-dashboard']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stock-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stock-dashboard'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # For private access, use: --no-allow-unauthenticated
      # and configure IAP or Cloud Identity

images:
  - 'gcr.io/$PROJECT_ID/stock-dashboard'

options:
  logging: CLOUD_LOGGING_ONLY
